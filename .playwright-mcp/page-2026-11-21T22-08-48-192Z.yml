        - generic [ref=f2e166]:
          - paragraph [ref=f2e167]: "\"Empecé a usar OdontoApp hace unos meses y el cambio fue inmediato. Antes anotaba todo a mano y perdía tiempo buscando datos de cada paciente. Ahora tengo la historia clínica completa en segundos, la agenda organizada y los recordatorios por WhatsApp se mandan solos. Es una herramienta simple pero que te transforma el consultorio.\""
