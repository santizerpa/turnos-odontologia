        - generic [ref=f2e158]:
          - paragraph [ref=f2e159]: "\"Las historias clínicas digitales me agilizaron un montón, con papel perdía mucho tiempo. La agenda y poder acceder desde el teléfono en cualquier momento son clave. Los recordatorios bajaron las ausencias, y algo que valoro mucho es que si pedís algo al equipo la respuesta es casi inmediata.\""
