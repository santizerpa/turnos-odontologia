            - img "Dra. Jorgelina Torres" [ref=f2e170]
            - generic [ref=f2e171]:
              - paragraph [ref=f2e172]: Dra. Jorgelina Torres
              - paragraph [ref=f2e173]: Odontóloga · Río Cuarto, Córdoba
        - generic [ref=f2e174]:
          - paragraph [ref=f2e175]: "\"Desde que uso OdontoApp me olvidé de mandar recordatorios manualmente. Tengo las historias clínicas en un solo lugar con seguimiento de tratamientos, y el periodontograma —que pocas apps tienen— me ayuda mucho con mis pacientes periodontales. Además puedo cargar radiografías y fotos directo en la nube, sin depender del celular.\""
          - generic [ref=f2e176]:
