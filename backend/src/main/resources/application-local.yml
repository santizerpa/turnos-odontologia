spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
  web:
    resources:
      static-locations: file:../frontend/dist/,classpath:/static/
  jpa:
    hibernate:
      ddl-auto: validate

# Demo local: habilita la bandeja de entrada simulada del paciente en la página pública.
app.demo.inbox.enabled: true
